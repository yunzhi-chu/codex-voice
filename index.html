<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CodeX 语音·飞书版</title>
<style>
:root{--bg:#f1f5f9;--card-bg:white;--text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;--accent:#3b82f6;--accent-hover:#2563eb;--border:#e2e8f0;--mic-bg:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);--code-bg:#0f172a;--code-text:#e2e8f0}
.dark{--bg:#0f172a;--card-bg:#1e293b;--text-primary:#f1f5f9;--text-secondary:#cbd5e1;--text-muted:#64748b;--border:#334155;--mic-bg:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);--code-bg:#020617}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{touch-action:manipulation;overscroll-behavior:none;width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;background:var(--bg);min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;transition:.3s}
.card{max-width:500px;width:100%;background:var(--card-bg);min-height:100dvh;padding:max(24px,env(safe-area-inset-top,24px)) 20px max(20px,env(safe-area-inset-bottom,20px)) 20px}
h1{font-size:1.5rem;color:var(--text-primary);font-weight:700;margin-bottom:4px}
.sub{color:var(--text-secondary);font-size:.82rem;border-left:3px solid var(--accent);padding-left:10px;margin-bottom:16px}
.mic-area{background:var(--mic-bg);border-radius:48px;padding:16px;text-align:center;margin-bottom:16px;border:1px solid var(--border)}
.mic-btn{background:var(--accent);border:none;color:white;font-size:1.2rem;padding:16px 36px;border-radius:60px;font-weight:700;width:100%;cursor:pointer;min-height:58px;box-shadow:0 6px 14px rgba(59,130,246,.35);-webkit-user-select:none}
.mic-btn:active{transform:scale(.96)}.mic-btn:disabled{opacity:.6;cursor:not-allowed}
#status{background:rgba(59,130,246,.08);padding:10px;border-radius:40px;font-size:.8rem;margin-top:10px;color:var(--accent);min-height:40px;display:flex;align-items:center;justify-content:center}
.result-box{background:var(--code-bg);color:var(--code-text);border-radius:20px;padding:14px 16px;font-family:monospace;font-size:.78rem;white-space:pre-wrap;word-break:break-word;margin:0 0 12px;max-height:50dvh;overflow-y:auto;line-height:1.5}
.send-bar{display:flex;gap:8px;margin-bottom:16px}
.send-bar button{flex:1;padding:12px;border-radius:30px;border:none;font-size:.85rem;font-weight:600;cursor:pointer;min-height:44px}
.btn-copy{background:var(--accent);color:white;box-shadow:0 4px 10px rgba(59,130,246,.3)}
.btn-feishu{background:#3370ff;color:white;box-shadow:0 4px 10px rgba(51,112,255,.3)}
footer{font-size:.65rem;text-align:center;color:var(--text-muted);margin-top:16px;padding-bottom:env(safe-area-inset-bottom,0)}
</style>
</head>
<body>
<div class="card">
  <h1>??? CodeX</h1>
  <div class="sub">语音输入 → 飞书发给 Codex</div>
  <div class="mic-area">
    <button id="micBtn" class="mic-btn">?? 点击说话</button>
    <div id="status">? 就绪</div>
  </div>
  <div class="send-bar">
    <button id="copyBtn" class="btn-copy">?? 复制</button>
    <button id="feishuBtn" class="btn-feishu">?? 发飞书</button>
  </div>
  <div id="responseArea" class="result-box">?? 说出命令 → 复制 → 发到飞书机器人，我来处理</div>
  <footer>语音→复制→飞书发给机器人 · Codex 回复在飞书里</footer>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const mb=$("micBtn"),st=$("status"),rp=$("responseArea"),cp=$("copyBtn"),fb=$("feishuBtn");
  let txt="",ing=false;

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null;
  try{rec=new SR();rec.lang="zh-CN";rec.interimResults=false;rec.maxAlternatives=1}catch{}

  function go(){
    if(!rec||ing)return;
    ing=true;mb.disabled=true;mb.textContent="?? 聆听...";st.textContent="??? 请说话...";
    try{rec.start()}catch{reset()}
  }
  function reset(){ing=false;mb.disabled=false;mb.textContent="?? 点击说话";st.textContent="? 就绪"}
  if(rec){
    rec.onresult=function(e){
      txt=e.results[0][0].transcript;
      st.textContent="? "+txt;
      rp.textContent="??? \""+txt+"\"\n\n?? 点「复制」或「发飞书」发送给我";
      reset();
    };
    rec.onerror=function(e){st.textContent="? "+e.error;reset()};
    rec.onend=reset;
  }
  mb.addEventListener("click",go);
  document.addEventListener("keydown",function(e){if(e.code==="Space"&&!e.repeat&&e.target.tagName!=="INPUT"){e.preventDefault();go()}});

  cp.addEventListener("click",function(){
    if(!txt&&!rp.textContent.includes("试试")){txt=rp.textContent.replace(/^[^]*?"/,"").replace(/".*$/,"")}
    navigator.clipboard.writeText(txt).then(()=>{const t=this.textContent;this.textContent="? 已复制!";setTimeout(()=>this.textContent=t,1500)}).catch(()=>alert("复制失败"));
  });

  fb.addEventListener("click",function(){
    if(!txt)return;
    navigator.clipboard.writeText(txt).then(()=>{
      st.textContent="? 已复制，正在打开飞书...";
      window.location.href="feishu://";
      setTimeout(()=>{st.textContent="? 粘贴到飞书机器人即可"},1000);
    });
  });
})();
</script>
</body>
</html>
